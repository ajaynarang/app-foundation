# .github/workflows/ci.yml
# Manual by default: run it from the Actions tab (or `gh workflow run ci.yml`).
# To run on every push to main and every PR targeting it, uncomment the two
# triggers below. Fails if lint, type-check, test, build or the Terraform checks fail.

name: CI

on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # Formatting gate (fast — fails early if Prettier drift)
  # ─────────────────────────────────────────────────────────────
  format:
    name: Formatting — Prettier
    runs-on: ubuntu-latest # runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  # ─────────────────────────────────────────────────────────────
  # Backend CI
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend and foundation packages — Lint, Type-check, Test, Build
    runs-on: ubuntu-latest # runs-on: self-hosted
    env:
      # ESLint and tsc over the whole backend can exceed Node's default heap on the runner.
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter=shared-types build

      - name: Generate Prisma client
        run: pnpm --filter @appshore/db prisma:generate

      # The backend consumes @appshore/{kernel,db,platform} through their built dist
      # (each package's "types" points at ./dist). Without this build the typed lint
      # and tsc see every foundation type as unresolved. pnpm builds them in
      # dependency order.
      - name: Build foundation packages
        run: pnpm --filter @appshore/kernel --filter @appshore/db --filter @appshore/platform build

      - name: Lint
        run: pnpm --filter=backend lint

      - name: Schema lint (ID + naming convention)
        run: pnpm --filter @appshore/db lint:schema

      - name: Type-check
        run: pnpm --filter=backend type-check

      - name: Unit tests
        run: pnpm --filter=backend test

      # Most platform behaviour (auth, guards, notifications, cache, queues) lives in
      # the foundation packages, and their specs are type-checked only here.
      - name: Foundation packages — type-check
        run: pnpm --filter @appshore/kernel --filter @appshore/db --filter @appshore/platform type-check

      - name: Foundation packages — unit tests
        run: pnpm --filter @appshore/kernel --filter @appshore/db --filter @appshore/platform test

      - name: RBAC gap audit
        run: npx tsx tests/scripts/audit-rbac-gaps.ts --ci
        continue-on-error: true

      - name: Build (verify compilation)
        run: pnpm --filter=shared-types build && pnpm --filter=backend build

  # ─────────────────────────────────────────────────────────────
  # API QA: boots the built backend against service containers and runs the
  # Playwright `api` project (smoke, RBAC matrix, tests/api). It calls the same
  # script as `pnpm verify:api`, so a local run and this job check the same thing.
  # Like every job in this file it runs only when the workflow is started by hand,
  # or on push and pull request once the triggers above are uncommented.
  # ─────────────────────────────────────────────────────────────
  api-qa:
    name: API QA — backend boot, smoke, RBAC, wire checks
    runs-on: ubuntu-latest # runs-on: self-hosted
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @appshore/db prisma:generate

      # Builds, migrates, seeds, starts the backend, runs the suite, stops the backend.
      # No browser is installed: the `api` project only makes HTTP requests.
      - name: API QA
        run: pnpm verify:api

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-qa-report
          path: tests/reports/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Web CI
  # ─────────────────────────────────────────────────────────────
  web:
    name: Web — Lint, Type-check, Test, Build
    runs-on: ubuntu-latest # runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter=shared-types build

      - name: Generate Prisma client
        run: pnpm --filter @appshore/db prisma:generate

      - name: Lint
        run: pnpm --filter=@app/web lint

      - name: Type-check
        run: pnpm --filter=@app/web type-check

      - name: Unit tests
        run: pnpm --filter=@app/web test

      - name: Build (verify compilation)
        run: pnpm --filter=@app/web build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCI-PLACEHOLDER-KEY
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000'

  # ─────────────────────────────────────────────────────────────
  # Mobile CI (Flutter) — independent of the node jobs
  # ─────────────────────────────────────────────────────────────
  mobile:
    name: Mobile — Analyze, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # ─────────────────────────────────────────────────────────────
  # Scaffold variants: scaffolds the repo with and without each optional feature
  # (Desk) and proves each copy installs, type-checks and passes the backend specs,
  # and that nothing outside the residue list still names Desk. It calls the same
  # script as `pnpm verify:scaffold`. Like every job in this file it runs only when
  # the workflow is started by hand, or on push and pull request once the triggers
  # above are uncommented.
  # ─────────────────────────────────────────────────────────────
  scaffold-variants:
    name: Scaffold variants — with and without Desk
    runs-on: ubuntu-latest # runs-on: self-hosted
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Fills the pnpm store, so each scaffolded copy installs from it.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scaffold variants
        run: pnpm verify:scaffold

  # ─────────────────────────────────────────────────────────────
  # Shared UI package CI
  # ─────────────────────────────────────────────────────────────
  ui:
    name: UI — Lint, Type-check
    runs-on: ubuntu-latest # runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter=@app/ui lint

      - name: Type-check
        run: pnpm --filter=@app/ui type-check

  # ─────────────────────────────────────────────────────────────
  # Terraform: format, validate and the offline tests (the AWS provider is
  # mocked, so no credentials and no cloud call). No backend and no plan against
  # a real account. `pnpm check:ops` runs the same four commands locally.
  # ─────────────────────────────────────────────────────────────
  terraform:
    name: Terraform — fmt, validate, test
    runs-on: ubuntu-latest # runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.5'
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate

      - name: Test
        run: terraform test
