# .github/workflows/deploy-frontend.yaml
# Deploy the web app to Vercel without a backend deploy.
# Use when only frontend code has changed and backend doesn't need updating.
#
# Required GitHub Secrets:
#   VERCEL_WEB_DEPLOY_HOOK_STAGING / VERCEL_WEB_DEPLOY_HOOK_PRODUCTION
#   VERCEL_TOKEN, VERCEL_TEAM_ID
#
# Optional deploy marker (docs/observability.md, "Deploy markers"); a no-op until both exist:
#   vars.GRAFANA_URL, secrets.GRAFANA_SA_TOKEN   Grafana deploy annotation
# The web's Sentry release is created by its own build (next.config.ts), from the commit Vercel builds.

name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate branch
    runs-on: ubuntu-latest # runs-on: self-hosted
    steps:
      - name: Enforce branch-environment mapping
        run: |
          ENV="${{ github.event.inputs.environment }}"
          BRANCH="${{ github.ref_name }}"
          if [ "$ENV" = "staging" ] && [ "$BRANCH" != "develop" ]; then
            echo "::error::Staging must be deployed from 'develop' branch. You selected '$BRANCH'."
            exit 1
          fi
          if [ "$ENV" = "production" ] && [ "$BRANCH" != "main" ]; then
            echo "::error::Production must be deployed from 'main' branch. You selected '$BRANCH'."
            exit 1
          fi
          echo "✓ Deploying $ENV frontend from $BRANCH"

  deploy:
    name: Deploy Frontend to Vercel
    needs: validate
    runs-on: ubuntu-latest # runs-on: self-hosted

    steps:
      - name: Trigger Vercel deployment
        run: |
          ENV="${{ github.event.inputs.environment }}"

          echo "Triggering web deployment..."
          if [ "$ENV" = "staging" ]; then
            curl -s -X POST "${{ secrets.VERCEL_WEB_DEPLOY_HOOK_STAGING }}" > /dev/null
          else
            curl -s -X POST "${{ secrets.VERCEL_WEB_DEPLOY_HOOK_PRODUCTION }}" > /dev/null
          fi
          echo "✓ Web deployment triggered"

      - name: Checkout
        uses: actions/checkout@v4

      # The hook only queues the Vercel build, so the line marks when the deploy was asked for, not when it went live.
      - name: Grafana deploy annotation
        env:
          GRAFANA_URL: ${{ vars.GRAFANA_URL }}
          GRAFANA_SA_TOKEN: ${{ secrets.GRAFANA_SA_TOKEN }}
          DEPLOY_ENV: ${{ github.event.inputs.environment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          .github/scripts/observability-markers.sh grafana-annotation \
            "Deploy web ${GITHUB_SHA:0:7} to ${DEPLOY_ENV} by ${GITHUB_ACTOR} (${RUN_URL})" \
            deploy "env:${DEPLOY_ENV}" service:web
