# GENERATED by scripts/generate.mjs from catalog/. Do not edit by hand.
apiVersion: 1
groups:
  - orgId: 1
    name: crons
    folder: "app alerts · production"
    interval: "5m"
    rules:
      - uid: prd-cron-missed
        title: "[production] Cron missed"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "${GRAFANA_PROM_UID}"
            model:
              refId: A
              expr: "(time() - max by (job_name) (last_over_time(app_cron_last_success_timestamp_seconds{job=\"app-backend\", env=\"production\"}[8d]))) > 2 * max by (job_name) (app_cron_expected_interval_seconds{job=\"app-backend\", env=\"production\"})"
              editorMode: code
              intervalMs: 1000
              maxDataPoints: 43200
              instant: true
              range: false
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: Error
        for: "0s"
        annotations:
          summary: "Cron {{ .Labels.job_name }} has not succeeded in twice its interval"
          description: The last success of this cron is older than twice the interval its schedule sets. A disabled schedule has no interval and never fires this.
          runbook_url: "https://github.com/your-org/your-repo/blob/main/docs/runbooks/queues-jobs.md#cron-missed"
        labels:
          severity: sev1
          env: production
          area: crons
          service: app-backend
          signal: prom
        isPaused: false
