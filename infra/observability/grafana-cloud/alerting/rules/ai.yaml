apiVersion: 1
groups:
  - orgId: 1
    name: ai
    folder: "app alerts · production"
    interval: "1m"
    rules:
      - uid: prd-ai-error-ratio
        title: "[production] AI error ratio above 20%"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "${GRAFANA_PROM_UID}"
            model:
              refId: A
              expr: "(sum(increase(app_ai_invocation_total{job=\"app-backend\", env=\"production\", status=~\"error|timeout|rate_limited\"}[15m])) / sum(increase(app_ai_invocation_total{job=\"app-backend\", env=\"production\"}[15m])) > 0.2) and (sum(increase(app_ai_invocation_total{job=\"app-backend\", env=\"production\"}[15m])) >= 5)"
              editorMode: code
              intervalMs: 1000
              maxDataPoints: 43200
              instant: true
              range: false
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: Error
        for: "0s"
        annotations:
          summary: "More than 20% of AI invocations failed in 15 minutes"
          description: "Errors, timeouts and provider rate limits over all invocations in the cost ledger, once there are at least 5 in the window. Budget refusals do not count."
          runbook_url: "https://github.com/your-org/your-repo/blob/main/docs/runbooks/ai.md#ai-error-ratio"
        labels:
          severity: sev2
          env: production
          area: ai
          service: app-backend
          signal: prom
        isPaused: false
