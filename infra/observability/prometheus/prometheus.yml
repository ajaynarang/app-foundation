# Local-only Prometheus for the `observability` compose profile. It scrapes nothing: the backend PUSHES metrics over
# OTLP (the worker has no HTTP port), to http://localhost:9090/api/v1/otlp/v1/metrics, enabled by the
# --web.enable-otlp-receiver flag in docker-compose.yml. With ENV_TYPE=development and no OTLP endpoint the backend
# sends metrics here on its own, while traces go to Tempo on localhost:4318. With an explicit endpoint, point metrics
# here with OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://localhost:9090/api/v1/otlp/v1/metrics (docs/observability.md).
#
# This is for trying metrics and PromQL on a laptop. It is not the production answer: a deployed product sends
# metrics to a hosted, Prometheus-compatible backend (docs/observability.md, level 2).
global:
  evaluation_interval: 30s

otlp:
  # Copy these resource attributes onto every series, so local queries can filter the way the hosted rules do. The
  # `env` label is already on every point (EnvLabelMetricExporter).
  promote_resource_attributes:
    - service.name
    - service.instance.id
    - deployment.environment

storage:
  tsdb:
    # A metric push can arrive a little late; accept it instead of dropping it.
    out_of_order_time_window: 10m
